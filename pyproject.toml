# Project definition for txadmin, the Transifex maintenance TUI.
# Run the tool with `uv run txadmin` and the tests with `uv run pytest`.

[project]
name = "txadmin"
version = "0.1.0"
description = "Terminal UI for maintaining the projects of a Transifex organisation"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "textual>=8.2",
]

[project.scripts]
txadmin = "txadmin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["txadmin"]
