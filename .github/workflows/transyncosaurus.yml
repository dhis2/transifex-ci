name: Transifex App Sync

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '11 23 * * *'
  workflow_dispatch:

jobs:
  langsync:
    name: Synchronise UI languages in transifex
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install https://github.com/Philip-Larsen-Donnelly/translayer/archive/refs/tags/v0.0.7.zip


    - name: Run the script
      run: python ./ui_language_spreader.py
      env:
        TX_TOKEN: ${{ secrets.DHIS2_APPS_TX_TOKEN }}

  build:
    name: Synchronise translations
    runs-on: ubuntu-latest
    needs: langsync
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
      shell: bash

    - name: install hub
      run: |
        hub_version="2.14.2"
        hub_filename="hub-linux-amd64-${hub_version}"
        downloadUrl="https://github.com/mislav/hub/releases/download/v${hub_version}/${hub_filename}.tgz"
        curl -fsSL ${downloadUrl} -o /tmp/${hub_filename}.tgz
        tar xzf /tmp/${hub_filename}.tgz -C /tmp/
        sudo mv /tmp/${hub_filename}/bin/hub /usr/local/bin
        hub --version
      shell: bash

    - name: Configure signed commits
      env:
        BOT_SSH_SIGNING_KEY: ${{ secrets.DHIS2_BOT_SSH_SIGNING_KEY }}
      run: |
        if [[ -z "$BOT_SSH_SIGNING_KEY" ]]; then
          echo "::error::Secret DHIS2_BOT_SSH_SIGNING_KEY is not set. See README 'Bot commit signing' section."
          exit 1
        fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$BOT_SSH_SIGNING_KEY" > ~/.ssh/signing_key
        chmod 600 ~/.ssh/signing_key
        ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
        git config --global user.name "dhis2-bot"
        git config --global user.email "apps@dhis2.org"
        git config --global gpg.format ssh
        git config --global user.signingkey ~/.ssh/signing_key.pub
        git config --global commit.gpgsign true
      shell: bash

    - name: Run the script
      run: ./transyncosaurus_ALL.sh
      shell: bash
      env:
        TXTOKEN: ${{ secrets.DHIS2_APPS_TX_TOKEN }}
        GITHUB_USER: ${{ secrets.DHIS2_GITHUB_USER }}
        GITHUB_PASSWORD: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
        TRANSIFEX_SYNC_TAG: jenkins-app-sync
